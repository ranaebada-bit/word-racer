<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Racer">
<meta name="theme-color" content="#14205c">
<title>Word Racer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Racer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#14205c;--sky2:#2a3fa8;--road:#2b2d3a;--yellow:#ffd23f;--red:#ef3e36;--green:#2bb673;--blue:#1d7bf2;--orange:#ff8c1a;--ink:#1b1b3a;--card:#fffdf6;--muted:#6b6f8a;
  --read:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;--ui:'Baloo 2','Trebuchet MS',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--sky1);min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:var(--ui);cursor:pointer;border:none}
input,select,textarea{font-family:var(--ui);font-size:16px;-webkit-user-select:text;user-select:text}
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background-color:var(--sky1);
  background-image:radial-gradient(2px 2px at 20% 15%,#fff8,transparent),radial-gradient(2px 2px at 70% 8%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff5,transparent),radial-gradient(2px 2px at 85% 25%,#fff7,transparent),radial-gradient(1.5px 1.5px at 10% 40%,#fff5,transparent),linear-gradient(180deg,var(--sky1),var(--sky2) 70%,#3c55c9)}
.screen{display:none;min-height:100dvh;max-width:560px;margin:0 auto;padding:14px 14px 24px;flex-direction:column;gap:12px}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:8px;color:#fff}
.chip{background:#ffffff1f;border:2px solid #ffffff33;border-radius:999px;padding:4px 14px;font-weight:800;font-size:24px;color:#fff;display:flex;align-items:center;gap:6px}
.chip.fire{background:#ff8c1a33;border-color:#ffb36a}
.spacer{flex:1}
.gear{background:none;font-size:22px;opacity:.55;padding:6px}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.35)}}
.hero{border-radius:24px;padding:8px 10px 12px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 110%,#ffd23f55,transparent 60%),#ffffff14;border:2px solid #ffffff2a}
.week{display:flex;justify-content:center;gap:8px;margin-top:6px}
.week b{width:32px;height:32px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;display:grid;place-items:center;font-size:16px}
.week b.ok{background:var(--yellow);border-color:#fff}
.week b.today{box-shadow:0 0 0 3px #ffffff99}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.races{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;align-items:center;gap:12px;border-radius:22px;padding:8px 12px 8px 10px;box-shadow:0 6px 0 #0004;color:#fff;text-align:left;position:relative;overflow:hidden;width:100%}
.rcard::after{content:'';position:absolute;right:-10px;top:0;bottom:0;width:46px;opacity:.18;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/16px 16px}
.rcard:active{transform:translateY(4px);box-shadow:0 2px 0 #0004}
.rcard .badge{width:58px;height:58px;flex:none;border-radius:50%;background:#00000022;border:3px solid #ffffff88;display:grid;place-items:center;font-size:32px;position:relative}
.rcard .badge .n{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--ink);font-size:16px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 0 #0003}
.rcard .info{flex:1;min-width:0;z-index:1}
.rcard .nm{font-size:21px;font-weight:800;line-height:1.05;text-shadow:0 2px 0 #0003}
.rcard .sub{font-size:14px;font-weight:700;opacity:.92;margin-top:3px}
.rcard .go{font-size:30px;z-index:1;width:44px;text-align:center}
.rcard.done .badge,.rcard.done .info{opacity:.6}
.rcard.done .go{font-size:36px}
.rcard.next{animation:glow2 1.4s infinite}
@keyframes glow2{50%{box-shadow:0 6px 0 #0004,0 0 0 7px #ffd23faa}}
.mini{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0f1a4fee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #ffffff22}
#home{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.mtile{border-radius:16px;background:none!important;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 2px;min-height:60px;font-size:28px;line-height:1;color:#fff;text-align:center}
.mtile:active{background:#ffffff1f!important}
.mtile b{font-size:12px;margin:0;line-height:1.1;font-weight:800;opacity:.9;white-space:nowrap}
.mtile:active{transform:translateY(3px)}
.week{align-items:flex-end}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:#fffc}
.coin{display:inline-block;vertical-align:-.15em;flex:none}
.tile{aspect-ratio:1;border-radius:24px;background:var(--card);box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-weight:800;font-size:40px;color:var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.tile .num{font-size:22px;line-height:1;background:var(--ink);color:#fff;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;position:absolute;top:8px;left:8px}
.tile.done{background:#eafbf1}
.tile.next{animation:glow 1.4s infinite;background:#fff6cf}
@keyframes glow{50%{box-shadow:0 6px 0 #0003,0 0 0 8px #ffd23f88}}
.tile.bonus{background:#efe2ff}.tile.garage{background:#e1efff}
.bounce{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
/* race */
.racebar{display:flex;align-items:center;gap:8px}
.iconbtn{width:46px;height:46px;border-radius:50%;background:#ffffff22;color:#fff;font-size:22px;font-weight:800;flex:none}
.track{flex:1;height:84px;background:var(--road);border-radius:14px;position:relative;overflow:hidden;border:3px solid #ffffff55}
.lane{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:repeating-linear-gradient(90deg,#fff9 0 14px,transparent 14px 26px)}
.finish{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/14px 14px}
.runner{position:absolute;left:0;width:64px;transition:left .9s cubic-bezier(.3,1.4,.6,1)}
#runner{top:1px}#rival{top:42px}
.runner.turbo::before{content:'🔥';position:absolute;left:-22px;top:6px;font-size:22px;animation:flick .2s infinite alternate}
@keyframes flick{to{transform:scale(1.25)}}
.racebar .track{flex:none;width:100%}
.pdots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.pdots b{width:12px;height:12px;border-radius:50%;background:#ffffff33}
.pdots b.on{background:var(--yellow)}
.pdots b.cur{background:#fff;box-shadow:0 0 0 3px #ffd23f99;animation:pop 1s infinite}
.pdots b.pit{background:#ff8c1a55}.pdots b.pit.on{background:var(--orange)}
.coins{min-width:64px;text-align:center;background:var(--yellow);color:var(--ink);border-radius:14px;padding:4px 8px;font-weight:800;font-size:20px}
.bubble-row{display:flex;align-items:flex-end;gap:6px;min-height:76px}
.mascot{width:90px;flex:none}
.bubble{flex:1;background:#fff;border-radius:20px 20px 20px 4px;padding:10px 14px;font-size:19px;font-weight:700;line-height:1.2;min-height:52px;display:flex;align-items:center}
.card{background:var(--card);border-radius:28px;min-height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px 12px;box-shadow:0 8px 0 #0003;position:relative}
.card.good{animation:goodflash .7s}.card.bad{animation:shake .5s ease-in-out}
@keyframes goodflash{30%{background:#d7f8e5;transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-4px) rotate(-1deg)}75%{transform:translateX(4px) rotate(1deg)}}
.tag{position:absolute;top:10px;left:14px;font-size:22px}
.card.final{padding-top:40px}
.card.final::before{content:'';position:absolute;left:0;right:0;top:0;height:26px;border-radius:28px 28px 0 0;background:repeating-conic-gradient(#1b1b3a 0 25%,#fff 0 50%) 0 0/26px 26px}
.card.final::after{content:'🏁 FINISH 🏁';position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;color:var(--ink);letter-spacing:2px;white-space:nowrap}
.word{font-family:var(--read);font-size:clamp(64px,20vw,100px);font-weight:700;display:flex;gap:2px;line-height:1.1}
.g{position:relative;padding:0 2px 22px;border-radius:12px;transition:background .2s}
.g i{position:absolute;left:50%;bottom:4px;transform:translateX(-50%)}
.g i.dot{width:12px;height:12px;border-radius:50%;background:var(--ink)}
.g i.dash{width:70%;height:6px;border-radius:3px;background:var(--ink)}
.nodots .g{padding-bottom:4px}.nodots .g i{display:none}
.g.lit{background:var(--yellow)}.g.lit i{background:var(--red)}
.sentence{font-family:var(--read);font-size:clamp(40px,11vw,60px);font-weight:700;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;line-height:1.2}
.sw{border-radius:10px;padding:0 4px;transition:background .2s}
.sw.miss{color:var(--orange)}.sw.lit{background:var(--yellow)}.sw .word{font-size:inherit}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;min-height:150px}
.mic{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a73,var(--red));color:#fff;font-size:66px;box-shadow:0 8px 0 #9e1d18,0 0 0 8px #ffffff33;display:grid;place-items:center}
.mic.ready{animation:invite 1.6s infinite}
@keyframes invite{50%{box-shadow:0 8px 0 #9e1d18,0 0 0 18px #ffffff22}}
.mic:active{transform:translateY(4px)}
.mic.listening{animation:pulse 1s infinite;background:radial-gradient(circle at 35% 30%,#7dffb5,var(--green));box-shadow:0 8px 0 #157a48,0 0 0 8px #ffffff55}
.mic:disabled{animation:none}
.mic.talking{background:radial-gradient(circle at 35% 30%,#b9c6ff,#6f82e8);box-shadow:0 8px 0 #3d4fa8,0 0 0 8px #ffffff22;position:relative;overflow:visible}
.mic.talking .ear{font-size:58px}
.mic.talking i{position:absolute;inset:-6px;border-radius:50%;border:4px solid #ffffff99;animation:wave 1.4s ease-out infinite}
.mic.talking i.w2{animation-delay:.7s}
@keyframes wave{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.mascot.talking{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-5px) rotate(-3deg)}}
@keyframes pulse{50%{box-shadow:0 8px 0 #157a48,0 0 0 22px #ffffff22}}
.round{width:76px;height:76px;border-radius:50%;background:#fff;font-size:36px;box-shadow:0 6px 0 #0003;display:grid;place-items:center}
.round:disabled{opacity:.4}
.round.g{background:var(--green)}.round.r{background:var(--red)}
.nomic{font-size:70px;text-align:center}
/* results */
.res{background:var(--card);border-radius:28px;padding:18px;text-align:center;box-shadow:0 8px 0 #0003}
.medal{font-size:90px;line-height:1}
.plus{font-size:34px;font-weight:800;color:var(--ink)}
.practice{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.practice span{font-family:var(--read);font-size:28px;background:#fff1e0;border-radius:10px;padding:2px 12px}
.unlock{background:linear-gradient(135deg,#ffd23f,#ff8c1a);border-radius:22px;padding:10px;text-align:center;font-size:40px;animation:pop .8s}
.bigrow{display:flex;justify-content:center;gap:24px}
.bigbtn{width:100px;height:100px;border-radius:28px;font-size:52px;box-shadow:0 6px 0 #0003;background:#fff}
.bigbtn.y{background:var(--yellow)}.bigbtn.g{background:var(--green)}.bigbtn.r{background:var(--red)}
.bigbtn:active{transform:translateY(4px)}
/* modal */
.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:24px;padding:18px;max-width:520px;width:100%;max-height:88dvh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:24px}
.garage{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcar{border-radius:18px;background:#f1f3ff;padding:6px;text-align:center;font-weight:800;font-size:18px;border:4px solid transparent}
.gcar.sel{border-color:var(--blue);background:#e1efff}
.gcar.locked{opacity:.6;position:relative}
.gst{display:flex;align-items:center;justify-content:center;gap:4px;min-height:30px}
.nextcar{display:flex;align-items:center;gap:8px;margin:8px auto 0;max-width:330px}
.nextcar .bar{flex:1;height:16px;border-radius:999px;background:#ffffff26;overflow:hidden;border:2px solid #ffffff44}
.nextcar .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8c1a);border-radius:999px}
.nextcar .nc{opacity:.75}
/* parent */
.faq details{border-bottom:1px solid #eee;padding:10px 0}.faq summary{font-weight:800;cursor:pointer;font-size:16px}.faq p{margin:8px 0 0;color:#444;font-size:15px;line-height:1.4}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wk div{background:#f3f5ff;border-radius:14px;padding:10px;text-align:center;font-size:14px;color:#555}.wk b{display:block;font-size:24px;color:var(--ink)}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 8px}.steps i{width:28px;height:6px;border-radius:3px;background:#dfe3f2}.steps i.on{background:var(--blue)}
.mictest{background:#f3f5ff;border-radius:14px;padding:10px;font-size:15px;line-height:1.4}
.newbadges{display:flex;gap:10px;justify-content:center;margin-top:8px}.newbadges .bdg{width:110px}.bdg.pop{animation:pop .6s}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.bdg{background:#fff4cc;border-radius:16px;padding:10px 4px;text-align:center}.bdg span{font-size:38px;display:block}.bdg small{font-size:12px;font-weight:700;color:#555}.bdg.locked{background:#eee}.bdg.locked span{filter:grayscale(1);opacity:.35}
.wash{position:fixed;inset:0;z-index:60;background:linear-gradient(#5ec8ff,#bfe9ff 60%,#7ad36b 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;touch-action:none}
.wash .stage{position:relative;width:320px;height:180px}
.wash .stage svg{position:absolute;left:0;top:0}
.wash canvas{position:absolute;left:0;top:0;width:320px;height:180px;touch-action:none}
.wash .skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#ffffffcc;border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;color:var(--ink)}
.wash .hand{font-size:46px;animation:bob 1s ease-in-out infinite}
.ic{display:inline-block;vertical-align:middle;flex:none}
.gobtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#2bb673;box-shadow:0 3px 0 #0003}
.gcarmini{height:36px;display:flex;align-items:center}
.gear{opacity:.8}
.mic .ic{color:#fff}
.nmbtns .btn{white-space:nowrap;font-size:16px}
.settings{gap:0;padding:6px 14px}
details.sec{border-bottom:1px solid #eef0f7}details.sec:last-child{border-bottom:0}
details.sec summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;font-weight:800;font-size:17px;color:var(--ink)}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .st{flex:1}
details.sec summary .sv{font-weight:700;font-size:14px;color:#777;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec summary::after{content:'';width:9px;height:9px;border-right:3px solid #aab;border-bottom:3px solid #aab;transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .2s}
details.sec[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.sec .sb{padding:0 2px 14px;display:flex;flex-direction:column;gap:8px}
.nextbadge{display:flex;align-items:center;gap:8px;margin:6px auto 0;max-width:330px;width:100%;background:none;color:#fff;font-weight:800}
.nextbadge .bar{flex:1;height:14px;border-radius:999px;background:#ffffff26;overflow:hidden;border:2px solid #ffffff44}
.nextbadge .bar i{display:block;height:100%;background:linear-gradient(90deg,#7dffb5,#2bb673);border-radius:999px}
.nextbadge .nbt{font-size:14px;min-width:54px;text-align:right}
.blist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.brow{display:flex;align-items:center;gap:12px;background:#f3f5ff;border-radius:18px;padding:10px;text-align:left;width:100%;color:var(--ink)}
.brow .bi{flex:1;min-width:0}.brow .bi b{font-size:19px}.brow small{font-size:13px;color:#666;font-weight:700}
.blv{display:flex;gap:4px;margin:4px 0}.blv i{width:22px;height:8px;border-radius:4px;border:1.5px solid #1b1b3a33}
.bbar{height:12px;border-radius:999px;background:#dfe3f2;overflow:hidden;margin-bottom:2px}.bbar i{display:block;height:100%;background:linear-gradient(90deg,#7dffb5,#2bb673);border-radius:999px}
.bsay{flex:none}
.bwin{position:fixed;inset:0;z-index:70;background:radial-gradient(circle,#2d4bd8ee,#0f1a4fee);display:grid;place-items:center}
.bwin-in{display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;text-align:center;animation:zoomin .6s cubic-bezier(.3,1.6,.5,1)}
.bwin-t{font-size:34px;font-weight:800}.bwin-s{font-size:18px;opacity:.85;margin-bottom:10px}
@keyframes zoomin{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.wd b.sh{background:#e1f4ff;border-color:#5ec8ff}
.report{white-space:pre-wrap;font:600 15px/1.5 inherit;font-family:inherit;background:#f3f5ff;border-radius:14px;padding:12px;margin:0;color:var(--ink)}
#paintBtn{position:absolute;top:8px;left:8px;width:48px;height:48px;border-radius:50%;background:#ffffff26;display:grid;place-items:center}
#paintBtn .dot{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#ef3e36;border:2px solid #fff}
#paintBtn.glow{animation:glow 1.4s infinite;background:#ffd23f55}
.gtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.gtabs button{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:16px;background:#f1f3ff;color:var(--ink);font-size:16px;min-height:52px}
.gtabs button.on{background:#e1efff;box-shadow:inset 0 0 0 3px var(--blue)}
.ghint{display:flex;align-items:center;gap:6px;margin:12px 0 4px;font-weight:800;color:#555;font-size:15px}
.gcar.spc{background:linear-gradient(135deg,#fff6d6,#ffe1f2)}
.gcar.spc.locked{opacity:1}
.rtot{display:flex;align-items:center;gap:3px;font-weight:800;font-size:17px;background:#ffffff26;border-radius:999px;padding:2px 8px 2px 4px}
.slots{display:flex;gap:3px;flex:1;justify-content:center}
.slot{border-radius:6px;background:#ffffff26;border:2px solid #ffffff44;display:grid;place-items:center}
.slot.on{background:#ffd23f;border-color:#fff}
.slot.pop{animation:pop .8s 2}
.res .slots .slot{background:#e4e7f2;border-color:#cfd5ea}.res .slots .slot.on{background:#ffd23f;border-color:#1b1b3a44}
.bring{position:relative;width:48px;height:48px;display:grid;place-items:center}.bring>svg:first-child{position:absolute;inset:0}.bring .dot{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:#ef3e36;border:2px solid #fff}
.testbadge{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:90;background:#ef3e36;color:#fff;font-weight:800;font-size:12px;padding:2px 10px;border-radius:0 0 8px 8px;pointer-events:none}
.nleft{font-weight:800;font-size:14px;white-space:nowrap}
.shopcars{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;margin-top:4px}.shopcars button{flex:none;border-radius:12px;background:#f1f3ff;padding:2px;border:3px solid transparent}.shopcars button.on{border-color:var(--blue);background:#e1efff}
.shopbtn{width:100%;margin:8px 0;display:flex;align-items:center;justify-content:center;gap:8px}
.shopcar{display:flex;justify-content:center;background:radial-gradient(circle at 50% 80%,#ffd23f44,transparent 60%),#eef1ff;border-radius:20px;padding:10px 0;margin:8px 0}
.shoptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shoptabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;background:#f1f3ff;font-size:13px;color:var(--ink)}
.shoptabs button.on{background:#e1efff;box-shadow:inset 0 0 0 3px var(--blue)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #1b1b3a33;position:relative;display:grid;place-items:center;box-shadow:0 3px 0 #0002}
.sw.wh{border:8px solid #2b2d3a}
.sw.sel{outline:4px solid var(--blue);outline-offset:2px}
.sw i{position:absolute;right:-6px;bottom:-6px;background:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;box-shadow:0 1px 3px #0003}
.shopact .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px}
.panel{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px 6px;border-radius:14px;background:#ffffff22;color:#fff;font-weight:800;font-size:16px}
.tabs button.on{background:#fff;color:var(--ink)}
.btn{border-radius:16px;padding:12px 16px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #0003;color:#fff;background:var(--blue)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.w{background:#fff;color:var(--ink);border:2px solid #ddd}
.hw{width:100%;min-height:260px;border:2px solid #dfe3f2;border-radius:14px;padding:10px;font-family:var(--read);font-size:18px;line-height:1.4}
.hint{color:var(--muted);font-size:14px;line-height:1.35}
.note{background:#fff4cc;border-radius:14px;padding:10px;font-size:15px;line-height:1.35}
.pv{display:flex;flex-wrap:wrap;gap:6px}
.pv span{font-family:var(--read);font-size:17px;border-radius:8px;padding:1px 8px}
.pv .s{background:#ffe3e1}.pv .r{color:var(--red);font-weight:700}
.card.redcard{box-shadow:0 8px 0 #0003,inset 0 0 0 8px var(--red)}
.word{position:relative}
.splitline{position:absolute;bottom:0;height:16px;border:5px solid var(--ink);border-top:none;border-radius:0 0 20px 20px;pointer-events:none}
.g.sp{padding-bottom:22px}.pv .w{background:#e1efff}.pv .t{background:#fff4cc}
.pv span.nov{outline:2px dashed var(--orange)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:8px 0}
.set label{font-weight:700}
.set select{border:2px solid #dfe3f2;border-radius:10px;padding:6px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 #0003;font-weight:800}
.lbrow .rk{font-size:30px;width:44px;text-align:center}
.lbrow .nm{flex:1;font-size:22px}
.lbrow .wd{font-size:24px;background:#e1efff;border-radius:14px;padding:2px 12px}
.lbrow.me{background:#fff6cf;box-shadow:0 4px 0 #0003,0 0 0 4px var(--yellow)}
.lblist{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:40;pointer-events:none;animation:fall 1.4s ease-in forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:64px;font-weight:800;color:var(--yellow);text-shadow:0 4px 0 #b34a00,0 0 20px #ff8c1a;z-index:45;pointer-events:none;animation:zoomout 1.2s forwards}
@keyframes zoomout{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.wheel{transform-box:fill-box;transform-origin:center}
.driving .wheel{animation:spin .4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.lboff{text-align:center;padding:30px 22px;margin:20px auto;max-width:460px;background:#ffffff1f;border-radius:22px;color:#fff;font-size:19px;line-height:1.45}
.lboff p{margin:10px 0}

  texts = (texts || []).filter(Boolean);
  if (it.type === 'sentence') {
    if (texts.length > 1) texts = [...texts, texts.join(' ')];
    const tw = norm(plain(it.text)).split(' '); let best = null;
    for (const tx of texts) { const hw = norm(tx).split(' '); const miss = tw.filter(w => !LENIENT.includes(w) && !hw.some(h => wordOk(w, h))); if (!best || miss.length < best.length) best = miss; }
    best = best || tw.filter(w => !LENIENT.includes(w));
    return { ok: best.length === 0, missing: best };
  }
  for (const tx of texts) for (const h of norm(tx).split(' ')) if (wordOk(it.text, h)) return { ok: true };
  return { ok: false };
}

/* ---- car wash: a short reward after each race. The child rubs the mud off the car. ---- */
function carWash() {
  return new Promise(res => {
    const W = 320, H = 180, el = document.createElement('div'); el.className = 'wash';
    el.innerHTML = `<button class="skip" aria-label="Skip">Skip ➜</button><div class="stage">${carSVG(S.car, W)}<canvas width="${W * 2}" height="${H * 2}"></canvas></div><div class="hand">${ic('sponge', 64)}</div>`;
    document.body.appendChild(el);
    const cv = el.querySelector('canvas'), g = cv.getContext('2d'); g.scale(2, 2);
    // mud: brown blobs over the car shape only
    g.fillStyle = '#8a5a2b';
    for (let i = 0; i < 70; i++) { g.beginPath(); g.arc(30 + Math.random() * 270, 40 + Math.random() * 120, 14 + Math.random() * 22, 0, 7); g.fill(); }
    g.fillStyle = '#6b4220'; for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(30 + Math.random() * 270, 40 + Math.random() * 120, 4 + Math.random() * 7, 0, 7); g.fill(); }
    const start = g.getImageData(0, 0, W * 2, H * 2).data; let mud = 0; for (let i = 3; i < start.length; i += 64) if (start[i]) mud++;
    let done = false, moves = 0, last = null;
    const finish = async win => {
      if (done) return; done = true; clearTimeout(tmo);
      if (win) { g.clearRect(0, 0, W, H); confetti(24); sfxWin(); await say('wash_done'); }
      el.remove(); res();
    };
    const rub = e => {
      const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
      g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.lineWidth = 46;
      g.beginPath(); g.moveTo(last ? last.x : x, last ? last.y : y); g.lineTo(x, y); g.stroke(); last = { x, y };
      if (++moves % 12 === 0) {   // how much mud is left?
        const d = g.getImageData(0, 0, W * 2, H * 2).data; let left = 0; for (let i = 3; i < d.length; i += 64) if (d[i]) left++;

  });
}

}
function nameVoiceHint() {
  if (!S.name) return 'The game shows the name and says it out loud.';
  const known = VOICE.n.has(nameKey(S.name));
  return `${S.nameRec ? 'The game uses your recording of the name.' : known ? 'The game knows how to say this name.' : '<b>The game’s voice doesn’t know this name</b>, so it will only show it. You can record it (3 seconds).'}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px" class="nmbtns">${hasNameVoice() ? `<button class="btn w" id="nmPlay" style="padding:8px 12px">${ic('speaker', 22)} Hear it</button>` : ''}<button class="btn w" id="nmRec" style="padding:8px 12px">${ic('record', 22)} ${S.nameRec ? 'Record again' : 'Record the name'}</button>${S.nameRec ? `<button class="btn w" id="nmDel" style="padding:8px 12px" aria-label="Delete recording">${ic('trash', 22)}</button>` : ''}</div>`;

function bindName(rerender) {

    const p = $('#nmPlay'); if (p) p.onclick = () => { ac(); sayName(); };
    const d = $('#nmDel'); if (d) d.onclick = () => { S.nameRec = null; save(); $('#nmVoice').innerHTML = nameVoiceHint(); wire(); };

let nameMR = null;
async function recordName(btn, done) {
  if (nameMR) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Recording isn't available here");
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("Can't use the microphone here"); }
  let type = ''; for (const t of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']) { try { if (MediaRecorder.isTypeSupported(t)) { type = t; break; } } catch (e) {} }
  const chunks = [], mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined); nameMR = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); nameMR = null;
    const buf = new Uint8Array(await new Blob(chunks).arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i++) s += String.fromCharCode(buf[i]);
    S.nameRec = { b64: btoa(s), type: mr.mimeType || type }; save(); toast('Saved ✓'); done();
  };
  btn.textContent = '⏺ Say the name now…'; mr.start(); setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 2500);
}
/* ---- microphone test (setup, settings and help) ---- */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const MIC_FIX = isIOS
  ? 'On iPhone: Settings → Apps → Safari → Microphone → <b>Allow</b>, and Settings → General → Keyboard → <b>Enable Dictation</b>. Then reload the game.'
  : `Tap the ${ic('lock', 16)} or ${ic('info', 16)} next to the web address, set Microphone to <b>Allow</b>, then reload the game.`;
function micTestBlock() {
  return `<div class="mictest" id="micTest"><b>Microphone test</b><br>Tap the button, then your child says <b>"cat"</b>.<div style="margin-top:8px"><button class="btn w" id="micTestGo" style="padding:8px 14px">${ic('mic', 22)} Test the microphone</button></div><div id="micTestRes" style="margin-top:6px"></div></div>`;
}
function bindMicTest() {
  const b = $('#micTestGo'); if (!b) return;
  b.onclick = () => {   // listen() must start straight from the tap (iPhone rule)
    const out = $('#micTestRes');
    if (!SR) { out.innerHTML = ic('cross', 18) + ' This browser can’t listen. ' + (isIOS ? 'Open the game in <b>Safari</b>.' : 'Open the game in <b>Chrome</b>.'); return; }
    b.disabled = true; out.textContent = 'Getting ready…';
    listen(5000, t => t.some(x => /\b(cat|kat|cats)\b/.test(norm(x))), () => { out.innerHTML = ic('speak', 20) + ' Say <b>"cat"</b> now!'; }).then(r => {
      b.disabled = false; setSession('playback');
      if (r.texts && r.texts.length) {
        const ok = r.texts.some(x => /\b(cat|kat|cats)\b/.test(norm(x)));
        out.innerHTML = ok ? `${ic('check', 18)} The microphone works. It heard: "${esc(r.texts[0])}"` : `${ic('warn', 18)} It heard "${esc(r.texts[0])}". The microphone works, but try again a bit closer and slower.`;
        if (micBlocked) { micBlocked = false; }
      } else if (['not-allowed', 'service-not-allowed'].includes(r.error)) out.innerHTML = ic('cross', 18) + ' The microphone is blocked. ' + MIC_FIX;
      else out.innerHTML = ic('warn', 18) + ' Nothing heard. Hold the phone closer and try again. If it keeps happening: ' + MIC_FIX;
    });
  };
}

Sentences:
get a hat
get a pen">${esc(S.homework)}</textarea>${nav()}`,
    () => `<h2 style="display:flex;align-items:center;gap:8px">${ic('trophy', 34)} Class list (optional)</h2><p class="hint">If your teacher gave you a class code, enter it to see who finished today. No code? Just tap Next.</p>
      <div class="panel" style="padding:0">${classBlock()}</div>${nav()}`,
    () => `<h2 style="display:flex;align-items:center;gap:8px">${ic('mic', 34)} Last step</h2>${micTestBlock()}<div style="height:8px"></div>${homeTip()}${nav(0, `Let's race! ${ic('flag', 22)}`)}`,
  ];
  modal(dots + body[step]());
  if (step === 0) { bindName(); const st = $('#suTest'); if (st) st.onclick = loadTestData; }

/* same name as another child on today's list: suggest a last initial (never blocks) */

/* ---- progress sharing: upload this phone's own progress, download the child's other phones ---- */
function ledger() {
  const days = {}; Object.keys(S.days).sort().slice(-120).forEach(k => { const d = S.days[k]; days[k] = { done: d.done || {}, coins: d.coins || 0, goal: !!d.goal, words: d.words || 0, help: d.help || {} }; });
  const stats = {}; Object.entries(S.stats || {}).sort((a, b) => b[1].seen - a[1].seen).slice(0, 400).forEach(([w, x]) => stats[w] = x);
  return { coins: S.coins || 0, spent: S.spent || 0, raceCount: S.raceCount || 0, turbos: S.turbos || 0, best: S.best || 0, days, stats };
}

  if (IS_TEST) return;

  try { await fetch(LB_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'push', player: S.lb.player, phone: S.lb.phone, data: ledger() }) }); } catch (e) {}
}

  const q = new URLSearchParams({ action: 'pull', player: S.lb.player });
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await (await fetch(LB_URL + '?' + q, { signal: ctl.signal })).json();
    if (!r || !r.ok || !Array.isArray(r.phones)) return false;   // older sheet script: nothing to share yet
    const o = {}; r.phones.forEach(x => { if (x.phone && x.phone !== S.lb.phone && x.data) o[x.phone] = x.data; });
    const before = JSON.stringify(S.others || {}); S.others = o; save();
    return JSON.stringify(o) !== before;
  } catch (e) { return false; } finally { clearTimeout(t); }
}
function sync() {   // push this phone, then pull the others; refresh the home screen if something changed
  if (syncing) return syncing;
  syncing = (async () => { await syncPush(); const changed = await syncPull(); if (changed && $('#home').classList.contains('on')) renderHome(); })().finally(() => { syncing = null; });
  return syncing;
}
/* same child on two phones: share one player code so they count as one */
function linkBlock() {
  return `<div class="hint">This phone's code: <b style="font-size:20px;letter-spacing:2px;color:var(--ink)">${esc(S.lb.player)}</b><br>On the other phone, open ${ic('gear', 16)} Settings and type this code below, so your child shows up once on the list. After linking, coins, medals, streaks and badges are added up across both phones.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px"><input type="text" id="lnkIn" placeholder="Other phone’s code" autocapitalize="off" autocomplete="off" spellcheck="false" style="flex:1;min-width:160px;border:2px solid #dfe3f2;border-radius:10px;padding:8px;font-size:18px"><button class="btn w" id="lnkGo" style="padding:8px 14px">${ic('link', 22)} Link</button></div>`;
}
function bindLink() {
  const go = $('#lnkGo'); if (!go) return;
  go.onclick = () => {
    const code = $('#lnkIn').value.trim().toLowerCase().replace(/\s+/g, '');
    if (!/^[a-z0-9]{4,20}$/.test(code)) return toast('Check the code: letters and numbers only');
    if (code === S.lb.player) return toast('That is this phone’s own code');
    S.lb.player = code; save(); toast('Linked ✓'); sync();
    if (view().goal) lbSubmit(); // already finished today: show up under the shared code
    pSettings();
  };
}
function classBlock() {
  return `<div class="set" style="flex-wrap:wrap"><label>Class code (for the "done today" list)</label><input type="text" id="clsIn" value="${esc(S.lb.cls)}" placeholder="optional" autocapitalize="characters" style="width:150px;border:2px solid #dfe3f2;border-radius:10px;padding:8px;font-size:18px"></div>
    <div class="set"><label>Show my child on the list</label><select id="clsOn"><option value="1" ${S.lb.on ? 'selected' : ''}>Yes</option><option value="0" ${S.lb.on ? '' : 'selected'}>No</option></select></div>
    <div class="hint">When your child finishes all of today's races, their first name and car appear on the class list with a ${ic('trophy', 16)}. No scores and no ranking. Choose "No" to stay off the list. Children who are off the list don't see it either.</div>
    <div id="lbDup"></div>`;
}
function bindClass() {
  const ni = $('#nmIn'); if (ni) ni.addEventListener('change', () => checkDupName());
  $('#clsIn').onchange = e => { S.lb.cls = e.target.value.trim().toUpperCase(); save(); };
  $('#clsOn').onchange = e => {
    const on = e.target.value === '1';
    if (!on && S.lb.on && S.lb.cls && LB_URL.startsWith('https://')) lbCall({ action: 'leave' });
    S.lb.on = on; save(); toast(on ? 'On the list ✓' : 'Removed from the list');
  };
}

$('#parentBtn').innerHTML = ic('gear', 32); $('#helpBtn').innerHTML = ic('speaker', 30); $('#exitRace').innerHTML = ic('close', 22);
$('#boardBack').innerHTML = ic('home', 30); $('#parentBack').innerHTML = ic('back', 26); $('#boardRefresh').innerHTML = ic('refresh', 26);
$('#boardBack').nextElementSibling.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px">${ic('trophy', 32)} Done today</span>`;
renderHome(); show('home');
// splash screen: until the game's voices are ready (at most 3 seconds)
Promise.race([allAudio, sleep(3000)]).then(() => { const sp = $('#splash'); if (sp) { sp.style.opacity = 0; setTimeout(() => sp.remove(), 450); } });
sync();
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
// keep the game and voices on the phone: faster opening, less data, works offline
if (IS_TEST) { const t = document.createElement('div'); t.className = 'testbadge'; t.textContent = 'TEST VERSION'; document.body.appendChild(t); }
else if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
