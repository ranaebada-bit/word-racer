<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Racer">
<meta name="theme-color" content="#14205c">
<title>Word Racer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#14205c;--sky2:#2a3fa8;--road:#2b2d3a;--yellow:#ffd23f;--red:#ef3e36;--green:#2bb673;--blue:#1d7bf2;--orange:#ff8c1a;--ink:#1b1b3a;--card:#fffdf6;--muted:#6b6f8a;
  --read:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;--ui:'Baloo 2','Trebuchet MS',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:var(--sky1);min-height:100dvh;overflow-x:hidden;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:var(--ui);cursor:pointer;border:none}
input,select,textarea{font-family:var(--ui);font-size:16px;-webkit-user-select:text;user-select:text}
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1;background-color:var(--sky1);
  background-image:radial-gradient(2px 2px at 20% 15%,#fff8,transparent),radial-gradient(2px 2px at 70% 8%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 30%,#fff5,transparent),radial-gradient(2px 2px at 85% 25%,#fff7,transparent),radial-gradient(1.5px 1.5px at 10% 40%,#fff5,transparent),linear-gradient(180deg,var(--sky1),var(--sky2) 70%,#3c55c9)}
.screen{display:none;min-height:100dvh;max-width:560px;margin:0 auto;padding:14px 14px 24px;flex-direction:column;gap:12px}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:8px;color:#fff}
.chip{background:#ffffff1f;border:2px solid #ffffff33;border-radius:999px;padding:4px 14px;font-weight:800;font-size:24px;color:#fff;display:flex;align-items:center;gap:6px}
.chip.fire{background:#ff8c1a33;border-color:#ffb36a}
.spacer{flex:1}
.gear{background:none;font-size:22px;opacity:.55;padding:6px}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.35)}}
.hero{border-radius:24px;padding:8px 10px 12px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 110%,#ffd23f55,transparent 60%),#ffffff14;border:2px solid #ffffff2a}
.week{display:flex;justify-content:center;gap:8px;margin-top:6px}
.week b{width:32px;height:32px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44;display:grid;place-items:center;font-size:16px}
.week b.ok{background:var(--yellow);border-color:#fff}
.week b.today{box-shadow:0 0 0 3px #ffffff99}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.races{display:flex;flex-direction:column;gap:12px}
.rcard{display:flex;align-items:center;gap:12px;border-radius:24px;padding:10px 14px 10px 10px;box-shadow:0 6px 0 #0004;color:#fff;text-align:left;position:relative;overflow:hidden;width:100%}
.rcard::after{content:'';position:absolute;right:-10px;top:0;bottom:0;width:46px;opacity:.18;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/16px 16px}
.rcard:active{transform:translateY(4px);box-shadow:0 2px 0 #0004}
.rcard .badge{width:74px;height:74px;flex:none;border-radius:50%;background:#00000022;border:3px solid #ffffff88;display:grid;place-items:center;font-size:42px;position:relative}
.rcard .badge .n{position:absolute;top:-4px;left:-4px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink);font-size:16px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 0 #0003}
.rcard .info{flex:1;min-width:0;z-index:1}
.rcard .nm{font-size:23px;font-weight:800;line-height:1.05;text-shadow:0 2px 0 #0003}
.rcard .sub{font-size:15px;font-weight:700;opacity:.92;margin-top:3px}
.rcard .go{font-size:34px;z-index:1;width:54px;text-align:center}
.rcard.done .badge,.rcard.done .info{opacity:.6}
.rcard.done .go{font-size:42px}
.rcard.next{animation:glow2 1.4s infinite}
@keyframes glow2{50%{box-shadow:0 6px 0 #0004,0 0 0 7px #ffd23faa}}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mtile{border-radius:20px;background:var(--card);box-shadow:0 5px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;font-size:38px;line-height:1.1;color:var(--ink)}
.mtile b{font-size:15px;margin-top:4px}
.mtile:active{transform:translateY(3px)}
.week{align-items:flex-end}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:#fffc}
.coin{display:inline-block;vertical-align:-.15em;flex:none}
.tile{aspect-ratio:1;border-radius:24px;background:var(--card);box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-weight:800;font-size:40px;color:var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.tile .num{font-size:22px;line-height:1;background:var(--ink);color:#fff;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;position:absolute;top:8px;left:8px}
.tile.done{background:#eafbf1}
.tile.next{animation:glow 1.4s infinite;background:#fff6cf}
@keyframes glow{50%{box-shadow:0 6px 0 #0003,0 0 0 8px #ffd23f88}}
.tile.bonus{background:#efe2ff}.tile.garage{background:#e1efff}
.bounce{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
/* race */
.racebar{display:flex;align-items:center;gap:8px}
.iconbtn{width:46px;height:46px;border-radius:50%;background:#ffffff22;color:#fff;font-size:22px;font-weight:800;flex:none}
.track{flex:1;height:84px;background:var(--road);border-radius:14px;position:relative;overflow:hidden;border:3px solid #ffffff55}
.lane{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:repeating-linear-gradient(90deg,#fff9 0 14px,transparent 14px 26px)}
.finish{position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/14px 14px}
.runner{position:absolute;left:0;width:64px;transition:left .9s cubic-bezier(.3,1.4,.6,1)}
#runner{top:1px}#rival{top:42px}
.runner.turbo::before{content:'🔥';position:absolute;left:-22px;top:6px;font-size:22px;animation:flick .2s infinite alternate}
@keyframes flick{to{transform:scale(1.25)}}
.coins{min-width:64px;text-align:center;background:var(--yellow);color:var(--ink);border-radius:14px;padding:4px 8px;font-weight:800;font-size:20px}
.bubble-row{display:flex;align-items:flex-end;gap:6px;min-height:76px}
.mascot{width:90px;flex:none}
.bubble{flex:1;background:#fff;border-radius:20px 20px 20px 4px;padding:10px 14px;font-size:19px;font-weight:700;line-height:1.2;min-height:52px;display:flex;align-items:center}
.card{background:var(--card);border-radius:28px;min-height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px 12px;box-shadow:0 8px 0 #0003;position:relative}
.card.good{animation:goodflash .7s}.card.bad{animation:shake .45s}
@keyframes goodflash{30%{background:#d7f8e5;transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tag{position:absolute;top:10px;left:14px;font-size:22px}
.word{font-family:var(--read);font-size:clamp(64px,20vw,100px);font-weight:700;display:flex;gap:2px;line-height:1.1}
.g{position:relative;padding:0 2px 22px;border-radius:12px;transition:background .2s}
.g i{position:absolute;left:50%;bottom:4px;transform:translateX(-50%)}
.g i.dot{width:12px;height:12px;border-radius:50%;background:var(--ink)}
.g i.dash{width:70%;height:6px;border-radius:3px;background:var(--ink)}
.nodots .g{padding-bottom:4px}.nodots .g i{display:none}
.g.lit{background:var(--yellow)}.g.lit i{background:var(--red)}
.sentence{font-family:var(--read);font-size:clamp(40px,11vw,60px);font-weight:700;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;line-height:1.2}
.sw{border-radius:10px;padding:0 4px;transition:background .2s}
.sw.miss{color:var(--orange)}.sw.lit{background:var(--yellow)}.sw .word{font-size:inherit}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;min-height:150px}
.mic{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a73,var(--red));color:#fff;font-size:66px;box-shadow:0 8px 0 #9e1d18,0 0 0 8px #ffffff33;display:grid;place-items:center}
.mic.ready{animation:invite 1.6s infinite}
@keyframes invite{50%{box-shadow:0 8px 0 #9e1d18,0 0 0 18px #ffffff22}}
.mic:active{transform:translateY(4px)}
.mic.listening{animation:pulse 1s infinite;background:radial-gradient(circle at 35% 30%,#7dffb5,var(--green));box-shadow:0 8px 0 #157a48,0 0 0 8px #ffffff55}
.mic:disabled{opacity:.45;animation:none}
@keyframes pulse{50%{box-shadow:0 8px 0 #157a48,0 0 0 22px #ffffff22}}
.round{width:76px;height:76px;border-radius:50%;background:#fff;font-size:36px;box-shadow:0 6px 0 #0003;display:grid;place-items:center}
.round:disabled{opacity:.4}
.round.g{background:var(--green)}.round.r{background:var(--red)}
.nomic{font-size:70px;text-align:center}
/* results */
.res{background:var(--card);border-radius:28px;padding:18px;text-align:center;box-shadow:0 8px 0 #0003}
.medal{font-size:90px;line-height:1}
.plus{font-size:34px;font-weight:800;color:var(--ink)}
.practice{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.practice span{font-family:var(--read);font-size:28px;background:#fff1e0;border-radius:10px;padding:2px 12px}
.unlock{background:linear-gradient(135deg,#ffd23f,#ff8c1a);border-radius:22px;padding:10px;text-align:center;font-size:40px;animation:pop .8s}
.bigrow{display:flex;justify-content:center;gap:24px}
.bigbtn{width:100px;height:100px;border-radius:28px;font-size:52px;box-shadow:0 6px 0 #0003;background:#fff}
.bigbtn.y{background:var(--yellow)}.bigbtn.g{background:var(--green)}.bigbtn.r{background:var(--red)}
.bigbtn:active{transform:translateY(4px)}
/* modal */
.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:24px;padding:18px;max-width:520px;width:100%;max-height:88dvh;overflow:auto}
.modal h2{margin:0 0 8px;font-size:24px}
.garage{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcar{border-radius:18px;background:#f1f3ff;padding:6px;text-align:center;font-weight:800;font-size:18px;border:4px solid transparent}
.gcar.sel{border-color:var(--blue);background:#e1efff}
.gcar.locked{opacity:.5;filter:grayscale(.9)}
/* parent */
.panel{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:10px 6px;border-radius:14px;background:#ffffff22;color:#fff;font-weight:800;font-size:16px}
.tabs button.on{background:#fff;color:var(--ink)}
.btn{border-radius:16px;padding:12px 16px;font-size:18px;font-weight:800;box-shadow:0 4px 0 #0003;color:#fff;background:var(--blue)}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.w{background:#fff;color:var(--ink);border:2px solid #ddd}
.hw{width:100%;min-height:260px;border:2px solid #dfe3f2;border-radius:14px;padding:10px;font-family:var(--read);font-size:18px;line-height:1.4}
.hint{color:var(--muted);font-size:14px;line-height:1.35}
.note{background:#fff4cc;border-radius:14px;padding:10px;font-size:15px;line-height:1.35}
.pv{display:flex;flex-wrap:wrap;gap:6px}
.pv span{font-family:var(--read);font-size:17px;border-radius:8px;padding:1px 8px}
.pv .s{background:#ffe3e1}.pv .r{color:var(--red);font-weight:700}
.card.redcard{box-shadow:0 8px 0 #0003,inset 0 0 0 8px var(--red)}
.word{position:relative}
.splitline{position:absolute;bottom:0;height:16px;border:5px solid var(--ink);border-top:none;border-radius:0 0 20px 20px;pointer-events:none}
.g.sp{padding-bottom:22px}.pv .w{background:#e1efff}.pv .t{background:#fff4cc}
.pv span.nov{outline:2px dashed var(--orange)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:8px 0}
.set label{font-weight:700}
.set select{border:2px solid #dfe3f2;border-radius:10px;padding:6px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:8px 12px;box-shadow:0 4px 0 #0003;font-weight:800}
.lbrow .rk{font-size:30px;width:44px;text-align:center}
.lbrow .nm{flex:1;font-size:22px}
.lbrow .wd{font-size:24px;background:#e1efff;border-radius:14px;padding:2px 12px}
.lbrow.me{background:#fff6cf;box-shadow:0 4px 0 #0003,0 0 0 4px var(--yellow)}
.lblist{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:40;pointer-events:none;animation:fall 1.4s ease-in forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:64px;font-weight:800;color:var(--yellow);text-shadow:0 4px 0 #b34a00,0 0 20px #ff8c1a;z-index:45;pointer-events:none;animation:zoomout 1.2s forwards}
@keyframes zoomout{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.wheel{transform-box:fill-box;transform-origin:center}
.driving .wheel{animation:spin .4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>

<section id="home" class="screen">
  <div class="top">
    <div class="chip fire" id="streakChip">🔥 0</div>
    <div class="chip" id="coinChip"></div>
    <div class="chip" id="nameChip" style="font-size:20px;display:none"></div>
    <div class="spacer"></div>
    <button class="gear" id="parentBtn" aria-label="Grown-ups">⚙️</button>
  </div>
  <div class="hero">
    <div class="bounce" id="heroCar" style="display:flex;justify-content:center"></div>
    <div class="week" id="week"></div>
  </div>
  <div id="tiles" style="display:flex;flex-direction:column;gap:14px"></div>
</section>

<section id="race" class="screen">
  <div class="racebar">
    <button class="iconbtn" id="exitRace" aria-label="Stop">✕</button>
    <div class="track"><div class="lane"></div><div class="finish"></div><div class="runner" id="runner"></div><div class="runner" id="rival"></div></div>
    <div class="coins" id="raceCoins"></div>
  </div>
  <div class="bubble-row"><div class="mascot" id="mascot"></div><div class="bubble" id="bubble"></div></div>
  <div class="card" id="card"></div>
  <div class="controls" id="controls"></div>
</section>

<section id="results" class="screen"><div id="resBody"></div></section>

<section id="board" class="screen">
  <div class="top"><button class="iconbtn" id="boardBack" aria-label="Home">🏠</button><div style="font-size:28px;font-weight:800;flex:1">🏆 Done today</div><button class="iconbtn" id="boardRefresh" aria-label="Refresh">🔄</button></div>
  <div id="boardBody"></div>
</section>

<section id="parent" class="screen">
  <div class="top"><button class="iconbtn" id="parentBack">←</button><div style="font-size:26px;font-weight:800">Grown-ups</div></div>
  <div class="tabs" id="ptabs"><button data-t="homework" class="on">Homework</button><button data-t="progress">Progress</button><button data-t="settings">Settings</button></div>
  <div id="pbody"></div>
</section>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const AUDIO = {};
const AUDIO_PACKS = ["core", "w1", "w2", "w3", "w4"];
const PHRASES = {"read_word": "Read the word!", "read_sentence": "Read the sentence!", "what_sound": "What sound is this?", "pit": "Pit stop! This one came back. Can you read it?", "pit_sound": "Pit stop! What sound is this?", "fred_word": "Not quite. Fred Talk it! Say the sounds, then blend them.", "fred_sentence": "Not quite. Fred Talk the orange words, then read it again.", "again": "Nearly! Have another go.", "fred_again": "Fred Talk it again, then blend!", "sound_again": "Nearly! Say the sound again.", "sounds_intro": "Let's go sound by sound. Say each sound when it lights up.", "blend_now": "Now blend them! Tap and say the word.", "listen": "Listen to me.", "your_turn_word": "Your turn! Say the word.", "your_turn_sentence": "Your turn! Read it to me.", "your_turn_sound": "Now you say it!", "didnt_hear": "I didn't hear you. Tap and try again!", "didnt_hear2": "Say it nice and loud, close to the phone!", "good_try": "Good try! We'll come back to it.", "great_job": "Great job!", "pr1": "Brilliant!", "pr2": "Super reader!", "pr3": "Zoom zoom! Yes!", "pr4": "Fantastic!", "pr5": "You did it!", "pr6": "Amazing!", "pr7": "Turbo reading!", "pr8": "Wow, great blending!", "spr1": "Yes! That's the sound!", "spr2": "Great sound!", "spr3": "Perfect!", "turbo": "Turbo boost! Three in a row!", "race_done": "Race complete! You beat the truck!", "race_lost": "Race complete! Great driving!", "goal_done": "Amazing! You finished all your races today! Your streak is growing!", "new_car": "Wow! You unlocked a new car!", "start_home": "Tap a race to start!", "leave_q": "Do you want to stop racing?", "no_mic": "I can't use the microphone. Ask a grown-up for help.", "tap_mic": "Tap the microphone, then read!", "garage": "Pick your car!", "all_done": "All races done! Try a bonus lap for extra points!", "lets_race": "Ready, steady, go!", "finish_line": "Last one! Read it to cross the finish line!", "welcome": "Hello racer! Tap a race to start!", "hello": "Hello", "well_done": "Well done", "setup_hi": "Hello racer!", "red_word": "This is a red word. We can't Fred Talk it. Listen!", "cups_look": "Look who finished their reading today!", "cup_done": "Well done! You finished today's reading. Here's your cup!", "cup_todo": "Finish all your races today to get your cup!", "cup_none": "Nobody has finished yet. Be the first to get a cup!", "race0": "Rocket Race!", "race1": "Lightning Lap!", "race2": "Superhero Sprint!", "race3": "Police Chase!", "race4": "Dino Dash!", "race5": "Space Speedway!", "race6": "Fire Truck Rescue!", "race7": "Grand Prix!", "race8": "Moto Madness!", "race9": "Sky Rally!", "bonus_lap": "Bonus lap! Extra coins!"};

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function dayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(k, n) { const [y, m, d] = k.split('-').map(Number); const dt = new Date(y, m - 1, d); dt.setDate(dt.getDate() + n); return dayKey(dt); }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); }
function hashStr(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }
function seeded(seed) { let x = seed || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }

/* ============ data ============ */
const KEY = 'wordRacer.v2';
const DEFAULT_HW = `Speed sounds: n, e, p, a, h, g, t, c, b, r, o, f, j, v, k, l, y, u, w
Words: red, jog, vet, run, jet, yes, rat, jam, yet, yum, win, web, wet, yap, van
Words: zip, fox, mix, box, fix, egg, kiss, mess, doll, bell, yell, hill
Green words: pen, cat, hen, hat, get
Sentences:
get a hat
get a hen
get a cat
get a pen`;
const CARS = [
  { name: 'Captain Zoom', body: '#ef3e36', accent: '#ffd23f', emblem: 'bolt', at: 0 },

function stat(it, firstTry, missed) { const k = norm(plain(it.text)); const s = S.stats[k] || (S.stats[k] = { seen: 0, first: 0, miss: 0 }); s.seen++; if (firstTry) s.first++; if (missed) s.miss++; }
function addMissed(it) { const d = plain(it.text); if (!R.missed.includes(d)) R.missed.push(d); }
function bump(cls) { const card = $('#card'); card.classList.remove('good', 'bad'); void card.offsetWidth; card.classList.add(cls); }
async function correct() {
  setBusy(true);
  const c = R.cur, it = c.it, st = stageName();
  let n = COINS[kindOf(it)][st] || 0; if (it.comeback && !c.modeled) n += 2;
  award(n); stat(it, c.stage === 0, c.stage > 0); countRead(it);
  if (c.stage > 0) addMissed(it);
  if (!it.comeback) { R.scored++; if (c.stage === 0) R.firstTry++; }
  sfxWin(); confetti(c.stage === 0 ? 30 : 14); bump('good');
  let turbo = false;
  if (c.stage === 0) { R.combo++; if (R.combo % 3 === 0) turbo = true; } else R.combo = 0;
  if (it.type === 'word') await sayWord(it.text);
  if (c.modeled) await say('great_job');
  else if (turbo) { $('#runner').classList.add('turbo'); flash('TURBO!'); award(3); await say('turbo'); }
  else { await say(pick(['pr1', 'pr2', 'pr3', 'pr4', 'pr5', 'pr6', 'pr7', 'pr8'])); if (Math.random() < .35) await sayName(); }
  advance();
}
function advance() { setBusy(true); R.idx++; R.rival += .6; moveCars(); setTimeout(nextItem, 350); }
async function finishRace() {
  const m = R.meta; let bonus = 0, goalNow = false;
  const ratio = R.scored ? R.firstTry / R.scored : 1;
  const won = R.rival < R.queue.length;
  const medal = won ? (ratio >= .8 ? 3 : ratio >= .5 ? 2 : 1) : 1;
  if (m.race != null) {
    const d = dayRec();
    if (!d.done[m.race]) bonus = 5;
    d.done[m.race] = Math.max(d.done[m.race] || 0, medal);
    if (!d.goal && doneToday() >= goalNeeded()) {
      d.goal = true; goalNow = true; bonus += 10; const t = today();
      S.streak = S.lastGoalDay === addDays(t, -1) ? S.streak + 1 : (S.lastGoalDay === t ? S.streak : 1);
      S.lastGoalDay = t; S.best = Math.max(S.best, S.streak);
    }
  } else bonus = 3;
  award(bonus); save(); if (goalNow) lbSubmit();
  sfxWin(); confetti(60);
  const plan = todayPlan(), d = dayRec();
  const next = plan.findIndex((_, i) => !d.done[i]);
  $('#resBody').innerHTML = `<div class="res">
      <div class="medal">${goalNow ? '🏆' : MEDAL[medal]}</div>
      <div style="display:flex;justify-content:center;align-items:flex-end;gap:6px">${carSVG(S.car, won ? 170 : 130)}${truckSVG(won ? 90 : 120)}</div>
      ${S.name ? `<div style="font-size:30px;font-weight:800">${esc(S.name)}</div>` : ''}<div class="plus">+${R.coins} ${coin(34)}</div>
      ${goalNow ? `<div style="font-size:40px;font-weight:800">🔥 ${S.streak}</div>` : ''}
      ${R.missed.length ? `<div class="practice">${R.missed.map(w => `<span data-say="${esc(w)}">${esc(w)} 🔊</span>`).join('')}</div>` : ''}
    </div>
    ${R.unlocked != null ? `<button class="unlock" id="driveNew" style="width:100%;margin-top:12px">🎉 ${carSVG(R.unlocked, 160)}</button>` : ''}
    <div class="bigrow" style="margin-top:16px">
      <button class="bigbtn" id="resHome" aria-label="Home">🏠</button>
      ${next >= 0 ? `<button class="bigbtn g" id="resNext" aria-label="Next race">▶️</button>` : `<button class="bigbtn y" id="resBonus" aria-label="Bonus">⭐</button>`}
    </div>`;
  show('results');
  document.querySelectorAll('[data-say]').forEach(s => s.onclick = () => { const t = s.dataset.say; t.includes(' ') ? saySentence(t) : sayWord(t); });
  $('#resHome').onclick = () => { stopAudio(); renderHome(); show('home'); };
  const nb = $('#resNext'); if (nb) nb.onclick = () => startRace(todayPlan()[next], { race: next, intro: 'race' + (next % RACES.length) });
  const bb = $('#resBonus'); if (bb) bb.onclick = bonusLap;
  const dn = $('#driveNew'); if (dn) dn.onclick = () => { S.car = R.unlocked; save(); sfxVroom(); dn.style.opacity = .6; };
  await sayName(); await say(goalNow ? 'goal_done' : won ? 'race_done' : 'race_lost');
  if (R.unlocked != null) await say('new_car');
  else if (next < 0 && !goalNow && m.race != null) await say('all_done');
}
$('#exitRace').onclick = () => {
  modal(`<div class="bigrow" style="padding:10px 0"><button class="bigbtn r" id="mLeave" aria-label="Stop">🏠</button><button class="bigbtn g" id="mStay" aria-label="Keep racing">▶️</button></div>`);
  say('leave_q');
  $('#mStay').onclick = () => { closeModal(); };

};

/* ============ PARENT ============ */

$('#parentBack').onclick = () => { renderHome(); show('home'); };
let ptab = 'homework';
$('#ptabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; ptab = b.dataset.t; renderParent(); };
function renderParent() { document.querySelectorAll('#ptabs button').forEach(b => b.classList.toggle('on', b.dataset.t === ptab)); ({ homework: pHomework, progress: pProgress, settings: pSettings })[ptab](); }
function preview(txt) {
  const hw = parseHomework(txt);
  const miss = [...hw.words, ...hw.sents.flatMap(s => norm(plain(s)).split(' '))].filter((w, i, a) => a.indexOf(w) === i && !hasWord(w));
  return `<div class="hint"><b>${hw.words.length}</b> words · <b>${hw.sents.length}</b> sentences → <b>${hw.words.length ? Math.ceil(hw.words.length / 8) : hw.sents.length ? 1 : 0}</b> races a day · red words are shown in red</div>
    <div class="pv">${hw.words.map(s => `<span class="w ${hasWord(s) ? '' : 'nov'} ${RED.has(s) || hw.reds.includes(s) ? 'r' : ''}">${esc(s)}</span>`).join('')}${hw.sents.map(s => `<span class="t">${esc(s)}</span>`).join('')}</div>
    ${miss.length ? `<div class="note">The game's voice doesn't have: <b>${miss.map(esc).join(', ')}</b>. It will use the phone's voice for these. Send them to Claude to add the natural voice.</div>` : ''}`;
}
function pHomework() {
  $('#pbody').innerHTML = `<div class="panel">
    <div class="hint">Paste the teacher's new homework here: commas between words, each sentence on its own line. Common red words (the, said, you…) are known already; for others, start a line with <b>Red words:</b>. The game builds the races by itself.</div>
    <textarea class="hw" id="hwTx" spellcheck="false" autocapitalize="off">${esc(S.homework)}</textarea>
    <div id="hwPv">${preview(S.homework)}</div>
    <button class="btn g" id="hwSave">💾 Save homework</button>
  </div>`;
  $('#hwTx').oninput = e => { $('#hwPv').innerHTML = preview(e.target.value); };
  allAudio.then(() => { const t = $('#hwTx'); if (t) $('#hwPv').innerHTML = preview(t.value); });
  $('#hwSave').onclick = () => {
    const oldHw = parseHomework(S.homework), nu = parseHomework($('#hwTx').value);
    [...oldHw.words, ...oldHw.sents].forEach(t => { if (!nu.words.includes(t) && !nu.sents.includes(t) && !S.review.includes(t)) S.review.push(t); });
    S.review = S.review.slice(-150);
    S.homework = $('#hwTx').value; refreshRed(); save(); toast('Saved ✓ New races are ready');
  };
}
function pProgress() {
  const rows = []; for (let i = 0; i < 14; i++) { const k = addDays(today(), -i); const d = S.days[k]; if (d && (d.coins || Object.keys(d.done).length)) rows.push(`<tr><td>${k}</td><td>${Object.keys(d.done).length}${d.plan ? '/' + d.plan.length : ''}</td><td>${d.coins}</td><td>${d.goal ? '🔥' : ''}</td></tr>`); }
  const tricky = Object.entries(S.stats).filter(([, s]) => s.miss > 0).map(([w, s]) => ({ w, ...s, rate: s.first / s.seen })).sort((a, b) => a.rate - b.rate || b.miss - a.miss).slice(0, 15);
  $('#pbody').innerHTML = `<div class="panel">
    <div style="display:flex;gap:8px;flex-wrap:wrap"><div class="chip" style="color:var(--ink);background:#fff4cc;font-size:17px">🔥 Streak ${currentStreak()}</div><div class="chip" style="color:var(--ink);background:#e1efff;font-size:17px">Best ${S.best}</div><div class="chip" style="color:var(--ink);background:#eafbf1;font-size:17px">🪙 ${S.coins}</div></div>
    <h3 style="margin:6px 0 0">Tricky ones</h3>
    ${tricky.length ? `<table><tr><th>Item</th><th>Read alone</th><th>Needed help</th></tr>${tricky.map(t => `<tr><td style="font-family:var(--read);font-size:18px">${esc(t.w)}</td><td>${t.first}/${t.seen}</td><td>${t.miss}</td></tr>`).join('')}</table>` : '<p class="hint">Nothing tricky yet.</p>'}
    <h3 style="margin:6px 0 0">What the microphone heard</h3>
    <p class="hint">The last 40 tries. If he read a word right but it shows ✗, the phone misheard him. "(no-speech)" means it heard nothing.</p>
    ${(S.heard || []).length ? `<table><tr><th>Time</th><th>Word</th><th>Heard</th><th></th></tr>${S.heard.map(x => `<tr><td>${x.at}</td><td style="font-family:var(--read)">${esc(x.t)}</td><td>${esc(x.h)}</td><td>${x.ok ? '✓' : '✗'}</td></tr>`).join('')}</table>` : '<p class="hint">Nothing yet.</p>'}
    <h3 style="margin:6px 0 0">Last 14 days</h3>
    ${rows.length ? `<table><tr><th>Day</th><th>Races</th><th>Coins</th><th>Goal</th></tr>${rows.join('')}</table>` : '<p class="hint">No races yet.</p>'}
  </div>`;
}
function pSettings() {
  const t = S.settings.tries, n = todayPlan().length;
  const opt = (v, cur, label) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${label ?? v}</option>`;
  $('#pbody').innerHTML = `<div class="panel">
    ${nameBlock()}
    ${classBlock()}
    <h3 style="margin:0">Help steps (tries at each step)</h3>
    <div class="set"><label>Words 1: read it alone</label><select id="tRead">${[1, 2, 3].map(v => opt(v, t.read)).join('')}</select></div>
    <div class="set"><label>Words 2: "Fred Talk it" (no hints)</label><select id="tFred">${[1, 2, 3].map(v => opt(v, t.fred)).join('')}</select></div>
    <div class="set"><label>Words 3: sounds light up</label><select id="tSounds">${[1, 2, 3].map(v => opt(v, t.sounds)).join('')}</select></div>
    <p class="hint">After that the game says the sounds and the word, your child repeats it, and it comes back a few items later.</p>

    <div class="set"><label>Daily goal (for the streak)</label><select id="sGoal">${opt('all', S.settings.goal, 'All races')}${Array.from({ length: Math.max(0, n - 1) }, (_, i) => opt(i + 1, S.settings.goal, `${i + 1} race${i ? 's' : ''}`)).join('')}</select></div>
    <div class="set"><label>Microphone checking</label><select id="sStrict"><option value="0" ${S.settings.strict ? '' : 'selected'}>Relaxed (recommended)</option><option value="1" ${S.settings.strict ? 'selected' : ''}>Strict</option></select></div>
    <p class="hint">Relaxed: if the phone mishears a vowel (e.g. writes “hell” or “heal” for <i>hill</i>), it still counts, unless the word it heard is also on the homework list.</p>
    <div class="set"><label>Sound dots under words</label><select id="sDots">${opt('1', S.settings.dots ? 1 : 0, 'Always')}${opt('0', S.settings.dots ? 1 : 0, 'Only when helping')}</select></div>
    <div class="note">${SR ? 'This browser can listen to your child.' : '<b>This browser can’t listen.</b> On iPhone, open the game in Safari.'}${micBlocked ? ' The microphone was blocked on this page.' : ''}</div>
    <button class="btn r" id="resetAll" style="margin-top:6px">Reset coins, streak and stats</button>
  </div>`;
  const bind = (id, fn) => $(id).onchange = e => { fn(e.target.value); save(); toast('Saved ✓'); };
  bind('#tRead', v => t.read = +v); bind('#tFred', v => t.fred = +v); bind('#tSounds', v => t.sounds = +v);
  bind('#sCome', v => S.settings.comebacks = +v); bind('#sGoal', v => S.settings.goal = v === 'all' ? 'all' : +v);
  bindName(pSettings); bindClass();
  bind('#sDots', v => S.settings.dots = v === '1'); bind('#sStrict', v => S.settings.strict = v === '1');
  $('#resetAll').onclick = () => {
    modal(`<h2>Reset coins, streak, cars and stats?</h2><p class="hint">The homework stays.</p><div style="display:flex;gap:10px"><button class="btn w" style="flex:1" onclick="closeModal()">Cancel</button><button class="btn r" style="flex:1" id="rsYes">Reset</button></div>`);
    $('#rsYes').onclick = () => { const keep = { homework: S.homework, review: S.review, settings: S.settings }; S = { ...fresh(), ...keep }; save(); closeModal(); toast('Reset'); pSettings(); };
  };
}

/* ---- child's name + first-run setup ---- */
function nameBlock() {
  const known = !!AUDIO['n_' + nameKey(S.name)];
  return `<div class="set" style="flex-wrap:wrap"><label>Child's name</label><input type="text" id="nmIn" value="${esc(S.name)}" placeholder="e.g. Omar" style="width:150px;border:2px solid #dfe3f2;border-radius:10px;padding:8px;font-size:18px"></div>
    <div id="nmVoice" class="hint">${nameVoiceHint()}</div>`;
}
function nameVoiceHint() {
  if (!S.name) return 'The game shows the name and says it out loud.';
  const known = !!AUDIO['n_' + nameKey(S.name)];
  return `${S.nameRec ? 'The game uses your recording of the name.' : known ? 'The game knows how to say this name.' : '<b>The game’s voice doesn’t know this name</b>, so it will only show it. You can record it (3 seconds).'}
    <div style="display:flex;gap:8px;margin-top:6px">${hasNameVoice() ? '<button class="btn w" id="nmPlay" style="padding:8px 12px">🔊 Hear it</button>' : ''}<button class="btn w" id="nmRec" style="padding:8px 12px">🎙️ ${S.nameRec ? 'Record again' : 'Record the name'}</button>${S.nameRec ? '<button class="btn w" id="nmDel" style="padding:8px 12px">🗑</button>' : ''}</div>`;
}
function bindName(rerender) {
  const wire = () => {
    const p = $('#nmPlay'); if (p) p.onclick = () => { ac(); sayName(); };
    const d = $('#nmDel'); if (d) d.onclick = () => { S.nameRec = null; save(); $('#nmVoice').innerHTML = nameVoiceHint(); wire(); };
    const r = $('#nmRec'); if (r) r.onclick = () => recordName(r, () => { $('#nmVoice').innerHTML = nameVoiceHint(); wire(); });
  };
  $('#nmIn').oninput = e => { S.name = e.target.value.trim(); save(); $('#nmVoice').innerHTML = nameVoiceHint(); wire(); };
  wire();
}
let nameMR = null;
async function recordName(btn, done) {
  if (nameMR) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Recording isn't available here");
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("Can't use the microphone here"); }
  let type = ''; for (const t of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']) { try { if (MediaRecorder.isTypeSupported(t)) { type = t; break; } } catch (e) {} }
  const chunks = [], mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined); nameMR = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); nameMR = null;
    const buf = new Uint8Array(await new Blob(chunks).arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i++) s += String.fromCharCode(buf[i]);
    S.nameRec = { b64: btoa(s), type: mr.mimeType || type }; save(); toast('Saved ✓'); done();
  };
  btn.textContent = '⏺ Say the name now…'; mr.start(); setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 2500);
}
function setupWizard() {
  if (S.setupDone || $('#modalBg').classList.contains('on')) return;
  modal(`<h2>🏎️ Welcome to Word Racer</h2>
    <p class="hint">A quick setup for grown-ups. You can change this later with ⚙️.</p>
    <div class="panel" style="padding:0">${nameBlock()}
    ${classBlock()}
    <label style="font-weight:700">This week's homework words and sentences</label>
    <textarea class="hw" id="suHw" style="min-height:150px" spellcheck="false" autocapitalize="off" placeholder="Words: cat, hen, zip, fox
Sentences:
get a hat
get a pen">${esc(S.homework)}</textarea>
    <div class="hint">Commas between words. Each sentence on its own line. Extra red words: start a line with "Red words:".</div>
    <button class="btn g" id="suGo">Let's race! 🏁</button></div>`);
  bindName(); bindClass();
  $('#suGo').onclick = () => {
    S.homework = $('#suHw').value; S.setupDone = true; refreshRed(); save(); closeModal(); renderHome();
  };
}

/* ---- class leaderboard (Google Sheet) ---- */
const LB_URL = 'https://script.google.com/macros/s/AKfycby9VJJwcEd1syIe-3SuG4LYih2gHZfXIzFmFPTwpIZqtkqADomYTDlBNttWQ4srIDk/exec';
const lbActive = () => !!(LB_URL.startsWith('https://') && S.lb.cls);
function countRead(it) { const d = dayRec(); d.words = (d.words || 0) + (it.type === 'sentence' ? norm(plain(it.text)).split(' ').length : 1); }
async function lbCall(params) {
  const q = new URLSearchParams({ class: S.lb.cls, day: today(), player: S.lb.player, ...params });
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try { const r = await fetch(LB_URL + '?' + q.toString(), { signal: ctl.signal }); return await r.json(); } catch (e) { return null; } finally { clearTimeout(t); }
}
// Sends "finished today" only when the daily goal is done and the parent allows it.
function lbSubmit() {
  if (!lbActive() || !S.lb.on || !dayRec().goal) return Promise.resolve(null);
  return lbCall({ action: 'done', name: S.name || 'Racer', car: S.car });
}
async function openBoard() {
  show('board'); stopAudio();
  $('#boardBody').innerHTML = '<div style="text-align:center;font-size:60px;padding:40px" class="bounce">🏎️</div>';
  const res = (await lbSubmit()) || await lbCall({ action: 'list' });
  if (!res || !res.ok) { $('#boardBody').innerHTML = '<div style="text-align:center;font-size:70px;padding:40px">📶❌</div>'; return; }
  const list = res.list || [], d = dayRec(), plan = todayPlan(), done = doneToday(), need = goalNeeded();
  const meDone = !!d.goal;
  const mine = meDone ? '' : `<div class="lbrow me">${carSVG(S.car, 70)}<div class="nm">${esc(S.name || '')}</div><div style="font-size:24px">${Array.from({ length: need }, (_, i) => i < done ? '🏁' : '⬜').join('')}</div></div>`;
  $('#boardBody').innerHTML = `<div class="lblist">${mine}${list.map(x => `<div class="lbrow ${x.player === S.lb.player ? 'me' : ''}"><div class="rk">🏆</div>${carSVG(x.car, 70)}<div class="nm">${esc(x.name)}</div></div>`).join('')}</div>`;
  if (meDone) await say('cup_done');
  else { await say(list.length ? 'cups_look' : 'cup_none'); await say('cup_todo'); }
}
$('#boardBack').onclick = () => { stopAudio(); renderHome(); show('home'); };
$('#boardRefresh').onclick = openBoard;
function classBlock() {
  return `<div class="set" style="flex-wrap:wrap"><label>Class code (for the "done today" list)</label><input type="text" id="clsIn" value="${esc(S.lb.cls)}" placeholder="optional" autocapitalize="characters" style="width:150px;border:2px solid #dfe3f2;border-radius:10px;padding:8px;font-size:18px"></div>
    <div class="set"><label>Show my child on the list</label><select id="clsOn"><option value="1" ${S.lb.on ? 'selected' : ''}>Yes</option><option value="0" ${S.lb.on ? '' : 'selected'}>No</option></select></div>
    <div class="hint">When your child finishes all of today's races, their first name and car appear on the class list with a 🏆. No scores and no ranking. Choose "No" to stay off the list (your child can still see who finished).</div>`;
}
function bindClass() {
  $('#clsIn').onchange = e => { S.lb.cls = e.target.value.trim().toUpperCase(); save(); };
  $('#clsOn').onchange = e => {
    const on = e.target.value === '1';
    if (!on && S.lb.on && S.lb.cls && LB_URL.startsWith('https://')) lbCall({ action: 'leave' });
    S.lb.on = on; save(); toast(on ? 'On the list ✓' : 'Removed from the list');
  };
}

renderHome(); show('home');
